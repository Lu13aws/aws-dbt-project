name: olist_analytics
version: '1.0.0'
config-version: 2

profile: olist_redshift

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2016-01-01'
  end_date: '2019-01-01'

models:
  olist_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: marts
      marketing:
        +materialized: table
        +schema: marketing

seeds:
  olist_analytics:
    +schema: seeds
    product_category_name_translation:
      +column_types:
        product_category_name: varchar(100)
        product_category_name_english: varchar(100)

snapshots:
  olist_analytics:
    +target_schema: snapshots
