version: 2

seeds:
  - name: product_category_name_translation
    description: >
      Maps Portuguese product category names (as they appear in the Olist source data)
      to English equivalents. Used to enrich product models with readable category labels.
    columns:
      - name: product_category_name
        description: Portuguese product category name as used in raw.products.
        data_tests:
          - not_null
      - name: product_category_name_english
        description: English translation of the product category.
        data_tests:
          - not_null
